# Static analysis: clang-tidy and clang-format. CodeQL is in codeql.yml.
#
# Report first, gate after triage.
# ------------------------------------
# Both jobs started advisory: reporting on every push, going green regardless,
# until somebody had read the findings and decided which were real. A check
# that fails on day one for hundreds of pre-existing reasons teaches people to
# ignore it, and then it is worse than not having it.
#
# Both backlogs are now triaged to zero and both gate, so a finding means the
# change in front of you introduced it. The switches in `env` remain, because
# the next analyser added here should go through the same sequence. See
# docs/static-analysis.md for what was fixed and what was declined.
#
# CodeQL lives in its own workflow, codeql.yml. It is advisory rather than
# gating, and separating it keeps this file's failures actionable in one way
# -- run the formatter, fix the finding -- and its badge honest.

name: SCA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sca-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The ETL commit CMakeLists.txt pins. Not a tag: a tag can be moved,
  # and a cache key that only names one would keep serving a stale
  # checkout of the previous content. tools/pins.py --check enforces
  # that this matches, and supply-chain.yml watches the tag itself.
  ETL_COMMIT: 081e920302e4062dbd122fc3c86255825ccaa666

  # Pinned for the same reason gcovr is: an analyser that changes its mind
  # between runs produces diffs nobody asked for and failures nobody can
  # reproduce.
  CLANG_VERSION: "18.1.8"

  # ---- the gates -------------------------------------------------------
  # "false" = report only. Flip to "true" once the findings are triaged.
  #
  # Both gated: each backlog was triaged to zero first, so a finding now means
  # the change in front of you introduced it. See docs/static-analysis.md.
  GATE_CLANG_TIDY: "true"
  GATE_CLANG_FORMAT: "true"

jobs:
  # Cheap, and it fails for a reason nobody has to investigate: something in
  # this repository restates a dependency pin and no longer agrees with
  # CMakeLists.txt. Runs first because it needs nothing installed.
  pins:
    name: Pins and tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Check every pin against CMakeLists.txt
        run: python3 tools/pins.py --check

      # Budgets, not prohibitions. Most are zero; the two that are not are the
      # deviations argued in docs/misra.md, so a third one fails here and the
      # argument has to be made rather than inherited.
      - name: Scan for constructs a safety subset constrains
        run: python3 tools/scan_constructs.py --check

      # The tools under tools/ generate published numbers -- the footprint
      # table, the SBOM. A bug there is a wrong figure rather than a failed
      # build, so they get a suite of their own. The cross job runs the same
      # suite against arm-none-eabi-g++; this run covers the host.
      - name: Test the generators
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Cache the ETL checkout
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: etl-tidy-${{ env.ETL_COMMIT }}

      - name: Install clang-tidy
        run: pipx install "clang-tidy==${{ env.CLANG_VERSION }}"

      # clang-tidy needs to know how each file is compiled. The flags matter
      # here more than usual: -fno-exceptions changes which paths exist.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMQTT_BUILD_EXAMPLES=OFF

      - name: Run
        id: tidy
        run: |
          set -uo pipefail

          # The four .cpp files pull in every header, and HeaderFilterRegex in
          # .clang-tidy limits reporting to include/mqtt, so this covers the
          # library without also analysing the tests or the fetched ETL.
          clang-tidy -p build --quiet $(git ls-files 'src/*.cpp') \
            2>/dev/null | tee clang-tidy.log
          rc=${PIPESTATUS[0]}

          count=$(grep -cE 'warning:|error:' clang-tidy.log || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "rc=$rc"       >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summary
        if: always()
        run: |
          {
            echo "### clang-tidy"
            echo
            echo "${{ steps.tidy.outputs.count }} finding(s)."
            echo
            if [ -s clang-tidy.log ]; then
              echo '```'
              grep -E 'warning:|error:' clang-tidy.log | sed 's|.*/paho-cpp-static/||' || true
              echo '```'
            fi
            echo
            if [ "${GATE_CLANG_TIDY}" = "true" ]; then
              echo "_Gating: findings fail this job._"
            else
              echo "_Advisory: reporting only. Set GATE_CLANG_TIDY to \`true\` in \`.github/workflows/sca.yml\` to gate._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-log
          path: clang-tidy.log

      - name: Gate
        if: always()
        run: |
          if [ "${GATE_CLANG_TIDY}" != "true" ]; then
            echo "Advisory run: ${{ steps.tidy.outputs.count }} finding(s), not failing."
            exit 0
          fi
          if [ "${{ steps.tidy.outputs.count }}" != "0" ]; then
            echo "clang-tidy reported ${{ steps.tidy.outputs.count }} finding(s)."
            exit 1
          fi
          echo "clang-tidy is clean."

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format
        run: pipx install "clang-format==${{ env.CLANG_VERSION }}"

      - name: Check
        id: fmt
        run: |
          set -uo pipefail

          : > format.diff
          files=0
          for f in $(git ls-files '*.cpp' '*.hpp'); do
            if ! clang-format --style=file "$f" | diff -u --label "a/$f" --label "b/$f" "$f" - >> format.diff; then
              files=$((files + 1))
            fi
          done

          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "$files file(s) differ from .clang-format"
          exit 0

      - name: Summary
        if: always()
        run: |
          {
            echo "### clang-format"
            echo
            echo "${{ steps.fmt.outputs.files }} file(s) differ from \`.clang-format\`."
            echo
            echo "The attached \`format.diff\` is a directly applicable patch:"
            echo
            echo '```bash'
            echo "git apply format.diff        # or:"
            echo "clang-format -i \$(git ls-files '*.cpp' '*.hpp')"
            echo '```'
            echo
            if [ "${GATE_CLANG_FORMAT}" = "true" ]; then
              echo "_Gating: any difference fails this job._"
            else
              echo "_Advisory: reporting only. The full diff is attached as an artefact._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the diff
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: format-diff
          path: format.diff

      - name: Gate
        if: always()
        run: |
          if [ "${GATE_CLANG_FORMAT}" != "true" ]; then
            echo "Advisory run: ${{ steps.fmt.outputs.files }} file(s) differ, not failing."
            exit 0
          fi
          if [ "${{ steps.fmt.outputs.files }}" != "0" ]; then
            echo "${{ steps.fmt.outputs.files }} file(s) are not formatted."
            exit 1
          fi
          echo "Formatting is clean."
