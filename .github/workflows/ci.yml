name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so the FetchContent cache key below actually means something. Keep in
  # step with the GIT_TAG in CMakeLists.txt.
  # The ETL commit CMakeLists.txt pins. Not a tag: a tag can be moved,
  # and a cache key that only names one would keep serving a stale
  # checkout of the previous content. tools/pins.py --check enforces
  # that this matches, and supply-chain.yml watches the tag itself.
  ETL_COMMIT: 081e920302e4062dbd122fc3c86255825ccaa666

  GCOVR_VERSION: "7.2"

  # The floor, not the target. Set a couple of points below where the suite
  # actually sits so ordinary churn does not trip it, and raise it deliberately
  # rather than letting it drift. Current: 93.9% line, 87.3% branch.
  #
  # Note these are gcovr's definitions. The Codecov badge reads lower because it
  # counts a partially-branched line as a partial rather than a hit; see the
  # Coverage section of the README.
  #
  # Function coverage is deliberately not gated. The suite instantiates the
  # client at several configurations, and each instantiation creates its own set
  # of template functions -- so testing more configurations lowers the function
  # percentage while raising every other one.
  COVERAGE_MIN_LINE: 92
  COVERAGE_MIN_BRANCH: 85

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux / GCC",    os: ubuntu-latest,  cc: gcc,   cxx: g++ }
          - { name: "Linux / Clang",  os: ubuntu-latest,  cc: clang, cxx: clang++ }
          - { name: "macOS / Clang",  os: macos-latest,   cc: clang, cxx: clang++ }
          # No cc/cxx: MSVC is selected by the generator, and exporting empty
          # CC/CXX would leave CMake probing for a compiler called "".
          - { name: "Windows / MSVC", os: windows-latest }

    steps:
      - uses: actions/checkout@v6

      - name: Cache the ETL checkout
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: etl-${{ runner.os }}-${{ matrix.cc || 'msvc' }}-${{ env.ETL_COMMIT }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        # MQTT_WERROR is on here and off by default. A consumer building this as
        # a subproject should not have their build broken by a new compiler's
        # new diagnostics, but ours should fail the moment one appears.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMQTT_WERROR=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Cache the ETL checkout
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: etl-asan-${{ env.ETL_COMMIT }}

      - name: Configure with ASan and UBSan
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMQTT_BUILD_EXAMPLES=OFF \
            -DMQTT_WERROR=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      # The zero-allocation suite replaces global operator new, which conflicts
      # with ASan's own allocator interception, so it is excluded here. It runs
      # in the plain build above.
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure -E no_alloc

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Cache the ETL checkout
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: etl-coverage-${{ env.ETL_COMMIT }}

      # Pinned: gcovr and gcov have to agree on the intermediate format, and a
      # mismatch reports 0% rather than failing, which is the worst outcome for
      # a number the README quotes.
      - name: Install gcovr
        run: pipx install "gcovr==${{ env.GCOVR_VERSION }}"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMQTT_COVERAGE=ON \
            -DMQTT_WERROR=ON \
            -DMQTT_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --parallel

      # The whole suite, no_alloc included: gcov's counters are increments in
      # already-existing frames, so they do not allocate and the zero-allocation
      # assertions still hold under instrumentation.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Only the library is measured. Instrumentation is PUBLIC so the header
      # templates get counted where they are actually compiled -- inside the
      # test objects -- but the tests themselves are not the subject.
      - name: Report
        run: |
          set -euo pipefail

          # gcovr will not create the directory for --html-details itself, and
          # the argument parse error it gives instead is not obviously about a
          # missing directory.
          mkdir -p coverage-html

          gcovr --root . \
            --filter 'include/mqtt/' \
            --filter 'src/' \
            --xml-pretty --output coverage.xml \
            --html-details coverage-html/index.html \
            --txt coverage.txt \
            --print-summary \
            --fail-under-line ${{ env.COVERAGE_MIN_LINE }} \
            --fail-under-branch ${{ env.COVERAGE_MIN_BRANCH }}

      # Runs even when the floor check above failed, so the PR shows what the
      # numbers actually were rather than just that a threshold was missed.
      - name: Job summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo
            echo "Floor: ${{ env.COVERAGE_MIN_LINE }}% line, ${{ env.COVERAGE_MIN_BRANCH }}% branch"
            echo
            echo '```'
            cat coverage.txt 2>/dev/null || echo "no report produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The hard gate is gcovr's floor above, which needs nothing external.
      # Codecov is for the badge, the trend and the PR annotations, so an
      # outage there must not turn a green build red.
      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          name: paho-cpp-static
          fail_ci_if_error: false

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html

  interop:
    name: Mosquitto interop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Cache the ETL checkout
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: etl-interop-${{ env.ETL_COMMIT }}

      - name: Install Mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-clients

      - name: Start broker
        run: |
          set -euo pipefail
          printf 'listener 1883 127.0.0.1\nallow_anonymous true\n' > mosq.conf

          # setsid and a full redirect so the background broker cannot hold the
          # step's stdout open, which is its own way of hanging a job.
          setsid mosquitto -c mosq.conf -v > mosq.log 2>&1 < /dev/null &
          echo $! > mosq.pid

          # Wait for it to actually accept, rather than sleeping and hoping. A
          # broker that failed to start is then reported here, in the step whose
          # job it was, instead of as a mystery timeout thirty seconds later.
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1883) 2>/dev/null; then
              echo "broker accepting connections after ${i}s"
              exit 0
            fi
            sleep 1
          done

          echo "broker never accepted a connection on 127.0.0.1:1883"
          cat mosq.log
          exit 1

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMQTT_WERROR=ON
          cmake --build build --parallel

      # The demo checks itself and exits non-zero if any stage of the session
      # did not complete: CONNACK, SUBACK, five publishes across all three QoS
      # levels, their acknowledgement handshakes, all five echoed back through
      # its own subscription, survival of an idle stretch longer than the
      # broker's keep-alive grace window, and a clean DISCONNECT.
      #
      # Deliberately not asserted by grepping mosquitto's log. Its wording is
      # not a stable interface -- it varies by version and build -- and an
      # assertion on someone else's log format fails for reasons that have
      # nothing to do with this client being correct.
      - name: Publish and subscribe against a real broker
        run: ./build/examples/pubsub_demo 127.0.0.1 1883 ci/interop

      - name: Fail on broker-side protocol errors
        run: |
          # A secondary net only, and deliberately a narrow pattern: the demo's
          # own checks are the real gate, and widening this to catch more
          # wording risks matching a line mosquitto logs in normal operation.
          if grep -iE 'malformed|protocol error|invalid' mosq.log; then
            echo "broker reported a protocol error"
            exit 1
          fi
          echo "no protocol errors logged"

      - name: Stop the broker
        if: always()
        run: |
          if [ -f mosq.pid ]; then
            kill "$(cat mosq.pid)" 2>/dev/null || true
          fi
          pkill -x mosquitto 2>/dev/null || true
          echo "broker stopped"

      - name: Upload broker log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mosquitto-log
          path: mosq.log
