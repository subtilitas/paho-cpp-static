name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The ETL commit CMakeLists.txt pins. Not a tag: a tag can be moved,
  # and a cache key that only names one would keep serving a stale
  # checkout of the previous content. tools/pins.py --check enforces
  # that this matches, and supply-chain.yml watches the tag itself.
  ETL_COMMIT: 7f290365a9f1b72bf89b4b77ec7dbe39b228bd8e

  GCOVR_VERSION: "7.2"

  # The floor, not the target. Set a couple of points below where the suite
  # actually sits so ordinary churn does not trip it, and raise it deliberately
  # rather than letting it drift. Current: 93.9% line, 87.3% branch.
  #
  # Note these are gcovr's definitions. The Codecov badge reads lower because it
  # counts a partially-branched line as a partial rather than a hit; see the
  # Coverage section of the README.
  #
  # Function coverage is deliberately not gated. The suite instantiates the
  # client at several configurations, and each instantiation creates its own set
  # of template functions -- so testing more configurations lowers the function
  # percentage while raising every other one.
  COVERAGE_MIN_LINE: 92
  COVERAGE_MIN_BRANCH: 85

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux / GCC",    os: ubuntu-latest,  cc: gcc,   cxx: g++ }
          - { name: "Linux / Clang",  os: ubuntu-latest,  cc: clang, cxx: clang++ }
          - { name: "macOS / Clang",  os: macos-latest,   cc: clang, cxx: clang++ }
          # No cc/cxx: MSVC is selected by the generator, and exporting empty
          # CC/CXX would leave CMake probing for a compiler called "".
          - { name: "Windows / MSVC", os: windows-latest }

    steps:
      - uses: actions/checkout@v7

      - name: Cache the ETL checkout
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: etl-${{ runner.os }}-${{ matrix.cc || 'msvc' }}-${{ env.ETL_COMMIT }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        # MQTT_WERROR is on here and off by default. A consumer building this as
        # a subproject should not have their build broken by a new compiler's
        # new diagnostics, but ours should fail the moment one appears.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMQTT_WERROR=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Cache the ETL checkout
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: etl-asan-${{ env.ETL_COMMIT }}

      - name: Configure with ASan and UBSan
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMQTT_BUILD_EXAMPLES=OFF \
            -DMQTT_WERROR=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      # The zero-allocation suite replaces global operator new, which conflicts
      # with ASan's own allocator interception, so it is excluded here. It runs
      # in the plain build above.
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure -E no_alloc

  install:
    name: Installed package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Cache the ETL checkout
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: etl-install-${{ env.ETL_COMMIT }}

      # Building inside the repository proves nothing about install(EXPORT):
      # add_subdirectory() and FetchContent both bypass the generated config,
      # so a broken one stays invisible until a consumer hits it. Everything
      # below therefore happens out of tree, against the install prefix only.
      - name: Build and install
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMQTT_BUILD_TESTS=OFF \
            -DMQTT_BUILD_EXAMPLES=OFF \
            -DMQTT_WERROR=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build --parallel
          cmake --install build

      - name: The package ships the ETL it was built against
        run: |
          set -euo pipefail
          test -f prefix/include/mqtt/client.hpp
          test -f prefix/include/paho-cpp-static/vendor/etl/version.h
          test -f prefix/lib/cmake/paho-cpp-static/paho-cpp-staticConfig.cmake
          test -f prefix/lib/cmake/paho-cpp-static/paho-cpp-staticTargets.cmake
          echo "install tree is complete"

      # The build tree is deleted first. If the exported config leaked a
      # build-tree path -- the usual way an export breaks -- the consumer stops
      # compiling here rather than on somebody else's machine.
      - name: Consume it out of tree
        run: |
          set -euo pipefail
          rm -rf build
          cmake -S tests/consumer -B consumer-build \
            -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build consumer-build --parallel
          ./consumer-build/consumer

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Cache the ETL checkout
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: etl-coverage-${{ env.ETL_COMMIT }}

      # Pinned: gcovr and gcov have to agree on the intermediate format, and a
      # mismatch reports 0% rather than failing, which is the worst outcome for
      # a number the README quotes.
      - name: Install gcovr
        run: pipx install "gcovr==${{ env.GCOVR_VERSION }}"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMQTT_COVERAGE=ON \
            -DMQTT_WERROR=ON \
            -DMQTT_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --parallel

      # The whole suite, no_alloc included: gcov's counters are increments in
      # already-existing frames, so they do not allocate and the zero-allocation
      # assertions still hold under instrumentation.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Only the library is measured. Instrumentation is PUBLIC so the header
      # templates get counted where they are actually compiled -- inside the
      # test objects -- but the tests themselves are not the subject.
      - name: Report
        run: |
          set -euo pipefail

          # gcovr will not create the directory for --html-details itself, and
          # the argument parse error it gives instead is not obviously about a
          # missing directory.
          mkdir -p coverage-html

          gcovr --root . \
            --filter 'include/mqtt/' \
            --filter 'src/' \
            --xml-pretty --output coverage.xml \
            --html-details coverage-html/index.html \
            --txt coverage.txt \
            --json-summary coverage.json \
            --print-summary \
            --fail-under-line ${{ env.COVERAGE_MIN_LINE }} \
            --fail-under-branch ${{ env.COVERAGE_MIN_BRANCH }}

      # The floor above is the gate; this is the README staying truthful. They
      # answer different questions -- "is it good enough" and "does the
      # repository still say what is true" -- so a change that moves coverage
      # legitimately still has to record it rather than only clear the bar.
      - name: Check the README coverage figures
        run: python3 tools/coverage.py --summary coverage.json --check

      # Runs even when the floor check above failed, so the PR shows what the
      # numbers actually were rather than just that a threshold was missed.
      - name: Job summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo
            echo "Floor: ${{ env.COVERAGE_MIN_LINE }}% line, ${{ env.COVERAGE_MIN_BRANCH }}% branch"
            echo
            echo '```'
            cat coverage.txt 2>/dev/null || echo "no report produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The hard gate is gcovr's floor above, which needs nothing external.
      # Codecov is for the badge, the trend and the PR annotations, so an
      # outage there must not turn a green build red.
      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          name: paho-cpp-static
          fail_ci_if_error: false

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html

  interop:
    name: Mosquitto interop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Cache the ETL checkout
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: etl-interop-${{ env.ETL_COMMIT }}

      - name: Install Mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-clients

      - name: Start broker
        run: |
          set -euo pipefail
          printf 'listener 1883 127.0.0.1\nallow_anonymous true\n' > mosq.conf

          # setsid and a full redirect so the background broker cannot hold the
          # step's stdout open, which is its own way of hanging a job.
          setsid mosquitto -c mosq.conf -v > mosq.log 2>&1 < /dev/null &
          echo $! > mosq.pid

          # Wait for it to actually accept, rather than sleeping and hoping. A
          # broker that failed to start is then reported here, in the step whose
          # job it was, instead of as a mystery timeout thirty seconds later.
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1883) 2>/dev/null; then
              echo "broker accepting connections after ${i}s"
              exit 0
            fi
            sleep 1
          done

          echo "broker never accepted a connection on 127.0.0.1:1883"
          cat mosq.log
          exit 1

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMQTT_WERROR=ON
          cmake --build build --parallel

      # The demo checks itself and exits non-zero if any stage of the session
      # did not complete: CONNACK, SUBACK, five publishes across all three QoS
      # levels, their acknowledgement handshakes, all five echoed back through
      # its own subscription, survival of an idle stretch longer than the
      # broker's keep-alive grace window, and a clean DISCONNECT.
      #
      # Deliberately not asserted by grepping mosquitto's log. Its wording is
      # not a stable interface -- it varies by version and build -- and an
      # assertion on someone else's log format fails for reasons that have
      # nothing to do with this client being correct.
      - name: Publish and subscribe against a real broker
        run: ./build/examples/pubsub_demo 127.0.0.1 1883 ci/interop

      - name: Fail on broker-side protocol errors
        run: |
          # A secondary net only, and deliberately a narrow pattern: the demo's
          # own checks are the real gate, and widening this to catch more
          # wording risks matching a line mosquitto logs in normal operation.
          if grep -iE 'malformed|protocol error|invalid' mosq.log; then
            echo "broker reported a protocol error"
            exit 1
          fi
          echo "no protocol errors logged"

      - name: Stop the broker
        if: always()
        run: |
          if [ -f mosq.pid ]; then
            kill "$(cat mosq.pid)" 2>/dev/null || true
          fi
          pkill -x mosquitto 2>/dev/null || true
          echo "broker stopped"

      - name: Upload broker log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mosquitto-log
          path: mosq.log

  interop-minimosq:
    name: minimosq interop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Cache the ETL checkout
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: etl-minimosq-${{ env.ETL_COMMIT }}

      # Mosquitto is one implementation, and a client tested against exactly
      # one is tested against its leniency as much as against the
      # specification. minimosq is an independent MQTT 3.1.1 implementation, so
      # the two disagree wherever this client is wrong.
      #
      # This tracks minimosq's latest *release* rather than a pinned version,
      # which is deliberate but has a cost: a release published there can fail
      # this job here, and the failure is not in this repository. The job is
      # separate from the ones that gate the library's own correctness for that
      # reason. Pin MINIMOSQ_TAG below to a fixed tag to stop tracking.
      - name: Resolve the latest minimosq release
        id: minimosq
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag=$(gh release view --repo subtilitas/minimosq-mqtt \
                  --json tagName --jq .tagName)

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "using minimosq $tag"

      # The release ships headers only, so the checksum is the whole integrity
      # story for what gets compiled in.
      - name: Download and verify the headers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release download "${{ steps.minimosq.outputs.tag }}" \
            --repo subtilitas/minimosq-mqtt \
            --pattern '*-headers.tar.gz*' --dir minimosq-release

          cd minimosq-release
          sha256sum --check ./*.sha256
          tar xzf ./*-headers.tar.gz

          dir=$(find . -maxdepth 1 -type d -name '*-headers' | head -1)
          echo "MINIMOSQ_DIR=$PWD/${dir#./}" >> "$GITHUB_ENV"

      - name: Build the client demo and the broker
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMQTT_BUILD_EXAMPLES=ON \
            -DMQTT_WERROR=ON \
            -DMQTT_MINIMOSQ_DIR="$MINIMOSQ_DIR"
          cmake --build build --parallel --target minimosq_broker pubsub_demo

      # The broker is the assertion. minimosq reports protocol violations,
      # refusals, failed sends and dropped deliveries through an observer, and
      # the harness exits non-zero if any of them happened -- so this does not
      # depend on matching words in a log.
      - name: Publish and subscribe against minimosq
        run: |
          set -euo pipefail

          ./build/tests/minimosq_broker 1884 > minimosq.log 2>&1 &
          bpid=$!

          for _ in $(seq 1 50); do
            if grep -q "listening on port" minimosq.log 2>/dev/null; then break; fi
            sleep 0.1
          done

          # set -e would abort here before the status could be captured, and
          # the broker's own verdict below is the more informative half.
          client=0
          timeout 120 ./build/examples/pubsub_demo 127.0.0.1 1884 demo/topic || client=$?

          kill -TERM "$bpid" 2>/dev/null || true
          if wait "$bpid"; then
            broker=0
          else
            broker=$?
          fi

          echo "--- broker ---"
          cat minimosq.log

          if [ "$client" -ne 0 ]; then
            echo "the client failed against minimosq"
            exit 1
          fi
          if [ "$broker" -ne 0 ]; then
            echo "minimosq reported events the client should not have caused"
            exit 1
          fi
          echo "clean session against minimosq ${{ steps.minimosq.outputs.tag }}"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### minimosq interop"
            echo
            echo "Broker: minimosq \`${{ steps.minimosq.outputs.tag }}\`, headers release."
            echo
            echo '```'
            tail -20 minimosq.log 2>/dev/null || echo "no broker log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the broker log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: minimosq-log
          path: minimosq.log

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Cache the ETL checkout
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: etl-fuzz-${{ env.ETL_COMMIT }}

      - name: Configure
        env:
          CXX: clang++
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DMQTT_FUZZ=ON \
            -DMQTT_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --parallel

      # The gate. Replaying the checked-in corpus is deterministic -- -runs is
      # a count, not a clock -- so this either passes or names an input, and it
      # does not depend on how loaded the runner is.
      - name: Replay the corpus
        run: ctest --test-dir build -L fuzz --output-on-failure

      # The search. This one is timed, so it explores a different amount on
      # every run and is not a gate in the same sense: it fails only if it
      # actually finds something, which is worth failing for.
      - name: Explore
        run: |
          set -euo pipefail
          mkdir -p findings

          for target in fuzz_codec fuzz_client; do
            echo "::group::$target"
            ./build/tests/"$target" \
              -max_total_time=180 \
              -max_len=256 \
              -print_final_stats=1 \
              -artifact_prefix=findings/"$target"- \
              tests/fuzz/corpus/"$target"
            echo "::endgroup::"
          done

      # A crash writes its input here. Without it the run says a crash happened
      # and throws away the only thing that reproduces it.
      - name: Upload any findings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: findings/
          if-no-files-found: ignore

  # The library is pinned to one ETL commit, but a consumer who already depends
  # on ETL builds against whatever they have. This job says which versions that
  # is actually true for, rather than leaving it to a consumer to discover.
  #
  # The floor is 20.40.1 because of the footprint, not the API: 20.39.0 and
  # 20.40.0 compile and pass, but etl::vector carried 8 more bytes per instance
  # before 20.40.1, which makes sizeof(Client<Cfg>) 56 bytes larger and every
  # figure in docs/configuration.md wrong. Both are kept in the matrix and
  # allowed to differ, so the boundary stays measured rather than remembered.
  #
  # There is no upper bound to test against: ETL has published no 21.x.
  etl-range:
    name: ETL ${{ matrix.etl }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        etl:
          - "20.39.0"   # below the footprint floor; API-compatible
          - "20.40.0"   # below the footprint floor; API-compatible
          - "20.40.1"   # the floor: first version with the current footprint
          - "20.41.0"
          - "20.43.0"
          - "20.44.0"
          - "20.46.0"
          - "20.48.1"   # the pinned version
    steps:
      - uses: actions/checkout@v7

      - name: Check out ETL ${{ matrix.etl }}
        uses: actions/checkout@v7
        with:
          repository: ETLCPP/etl
          ref: ${{ matrix.etl }}
          path: etl-src

      # MQTT_ETL_DIR is the consumer-supplied path, so this exercises the same
      # code path an integrator with their own ETL takes.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DMQTT_ETL_DIR="${GITHUB_WORKSPACE}/etl-src" \
            -DMQTT_WERROR=ON \
            -DMQTT_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --parallel

      # mqtt_tests is run directly rather than through ctest so its output can
      # be kept for the footprint step below, which would otherwise mean running
      # the whole 174-case suite a second time per ETL version. pipefail is what
      # makes the runner's exit code survive the pipe into tee. The remaining
      # ctest cases are the compile-failure ones, which have to go through ctest
      # because the build is the test.
      - name: Test
        run: |
          set -euo pipefail
          ./build/tests/mqtt_tests 2>&1 | tee mqtt-tests.log
          ctest --test-dir build --output-on-failure -E '^mqtt_tests$'

      # Recorded rather than asserted. sizeof is excluded from the compatibility
      # promise, so a change here is news and not a failure -- but it is the
      # number an integrator sizes a build against, so it belongs in the log
      # next to the version that produced it.
      - name: Record the footprint
        run: |
          set -euo pipefail
          {
            echo "### ETL ${{ matrix.etl }}"
            grep 'sizeof(Client' mqtt-tests.log
          } | tee -a "$GITHUB_STEP_SUMMARY"
