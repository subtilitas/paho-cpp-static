# Cuts a GitHub release from a version tag.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# The release is assembled as a draft, the per-platform archives are uploaded
# into it, and it is only published once every platform has succeeded. A failure
# half way through therefore leaves a draft to delete rather than a published
# release that is missing artefacts.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The ETL commit CMakeLists.txt pins. Not a tag: a tag can be moved,
  # and a cache key that only names one would keep serving a stale
  # checkout of the previous content. tools/pins.py --check enforces
  # that this matches, and supply-chain.yml watches the tag itself.
  ETL_COMMIT: 7f290365a9f1b72bf89b4b77ec7dbe39b228bd8e

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Verify and open a draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the tag and check it against the project version
        id: meta
        run: |
          set -euo pipefail

          tag="${{ github.event.inputs.tag || github.ref_name }}"
          tagged="${tag#v}"

          # A release candidate carries a suffix -- v1.0.0-rc1 -- that
          # project(VERSION ...) cannot hold, because CMake takes digits and
          # dots only. CMakeLists declares the suffix separately and
          # tools/pins.py joins the two, so the comparison below is against one
          # value from one place rather than a version reassembled here.
          declared=$(python3 tools/pins.py --field version-full)
          prerelease=$(python3 tools/pins.py --field prerelease)
          if [ -z "$declared" ]; then
            echo "could not read the version out of CMakeLists.txt"
            exit 1
          fi

          # Tags here have been written both ways -- v1.3 as well as v0.1.0 --
          # while CMake always declares three components. So compare on meaning
          # rather than on spelling: pad both to major.minor.patch first, with
          # any suffix set aside and put back. v0.2 and v0.2.0 are then the
          # same release, and a tag that genuinely disagrees with what is
          # declared -- which would ship archives named after a version nobody
          # declared -- still fails.
          pad3() {
            local core="${1%%-*}"
            local suffix=""
            case "$1" in *-*) suffix="-${1#*-}" ;; esac

            case "$(printf '%s' "$core" | tr -cd '.' | wc -c)" in
              0) printf '%s.0.0%s' "$core" "$suffix" ;;
              1) printf '%s.0%s'   "$core" "$suffix" ;;
              *) printf '%s%s'     "$core" "$suffix" ;;
            esac
          }

          version=$(pad3 "$declared")
          if [ "$(pad3 "$tagged")" != "$version" ]; then
            echo "tag $tag implies version $tagged, but CMakeLists.txt declares $declared"
            exit 1
          fi

          # A suffix means this is not the release users should land on by
          # default, so the release is marked as a prerelease and never becomes
          # "latest". The declaration drives it: a tag alone cannot make a
          # final release out of a candidate, or the reverse.
          if [ -n "$prerelease" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          # Archives are named from the declared version, so a v0.2 tag and a
          # v0.2.0 tag both produce paho-cpp-static-0.2.0-<platform>.
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $tag as version $version (prerelease: ${prerelease:-no})"

      # Generated, not stored. The pin lives in CMakeLists.txt and the SBOM is
      # derived from it, so the two cannot disagree -- which is the failure
      # that makes an SBOM actively harmful, because somebody acts on it.
      #
      # SOURCE_DATE_EPOCH is the tagged commit's own date, so re-running this
      # for the same tag produces byte-identical documents and the asset can
      # be checked against the one that shipped.
      - name: Generate the SBOM
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            python3 tools/make_sbom.py --all --outdir sbom
          ls -la sbom

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; reusing it as a draft"
            gh release edit "$tag" --draft \
              --prerelease=${{ steps.meta.outputs.prerelease }}
          else
            gh release create "$tag" \
              --draft \
              ${{ steps.meta.outputs.prerelease == 'true' && '--prerelease' || '' }} \
              --title "$tag" \
              --generate-notes
          fi

      # Attached to the release rather than only bundled in the archives, so
      # an integrator can read the dependency graph before downloading
      # anything -- which is the order their review actually happens in.
      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" \
            sbom/sbom.cdx.json sbom/sbom.spdx.json --clobber

  package:
    name: Package ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "linux-x86_64",  os: ubuntu-latest,  cc: gcc,   cxx: g++ }
          - { name: "macos-arm64",   os: macos-latest,   cc: clang, cxx: clang++ }
          - { name: "windows-x86_64", os: windows-latest }

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Cache the ETL checkout
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: etl-${{ runner.os }}-${{ matrix.cc || 'msvc' }}-${{ env.ETL_COMMIT }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMQTT_WERROR=ON \
            -DMQTT_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX=stage

      - name: Build
        run: cmake --build build --config Release --parallel

      # A release that has not been tested is a rumour.
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release

      - name: Archive
        id: archive
        run: |
          set -euo pipefail
          name="paho-cpp-static-${{ needs.prepare.outputs.version }}-${{ matrix.name }}"

          cp LICENSE NOTICE.md README.md SECURITY.md CHANGELOG.md stage/

          # The archive carries its own bill of materials. An archive that has
          # been copied into an internal mirror, renamed, and rediscovered two
          # years later still says what is in it.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            python3 tools/make_sbom.py --all --outdir stage

          mv stage "$name"

          if [ "${{ runner.os }}" = "Windows" ]; then
            file="$name.zip"
            7z a -tzip "$file" "$name" > /dev/null
          else
            file="$name.tar.gz"
            tar -czf "$file" "$name"
          fi

          # Shipped alongside so a consumer can verify what they downloaded.
          if command -v sha256sum > /dev/null; then
            sha256sum "$file" > "$file.sha256"
          else
            shasum -a 256 "$file" > "$file.sha256"
          fi

          echo "file=$file" >> "$GITHUB_OUTPUT"
          cat "$file.sha256"

      - name: Upload into the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            "${{ steps.archive.outputs.file }}" \
            "${{ steps.archive.outputs.file }}.sha256" \
            --clobber

      - name: Keep the archive as a workflow artefact too
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.archive.outputs.file }}

  publish:
    name: Publish
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Drop the draft flag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false
          echo "published ${{ needs.prepare.outputs.tag }}"
